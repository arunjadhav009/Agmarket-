<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    width: 1080px;
    height: 1350px;
    background: radial-gradient(circle at 50% 25%, {{THEME_COLOR_LIGHT}} 0%, #0a0e17 65%, #05070b 100%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 50px 45px 40px 45px;
    position: relative;
    overflow: hidden;
  }

  /* सिनेमॅटिक बॅकग्राउंड ग्लो आणि रिंग्स */
  .ambient-glow {
    position: absolute;
    top: 18%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 650px;
    height: 650px;
    background: radial-gradient(circle, {{THEME_COLOR}} 0%, rgba(0,0,0,0) 70%);
    opacity: 0.45;
    filter: blur(50px);
    z-index: 1;
  }

  .content-layer {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    height: 100%;
    justify-content: space-between;
  }

  /* टॉप बार आणि युनिक स्टेट बॅज */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .state-badge {
    background: linear-gradient(135deg, {{THEME_COLOR}}, #111827);
    border: 1.5px solid rgba(255,255,255,0.25);
    padding: 10px 24px;
    border-radius: 40px;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  .report-tag {
    font-size: 18px;
    color: #cbd5e1;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pulse-dot {
    width: 12px;
    height: 12px;
    background: #22c55e;
    border-radius: 50%;
    box-shadow: 0 0 12px #22c55e;
  }

  /* मध्यवर्ती सिनेमॅटिक व्हिज्युअल एरिया */
  .hero-section {
    text-align: center;
    margin-top: 10px;
  }
  .onion-graphic-card {
    position: relative;
    width: 320px;
    height: 320px;
    margin: 0 auto 20px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.01) 70%);
    border: 2px solid rgba(255,255,255,0.15);
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8), inset 0 0 35px {{THEME_COLOR}};
  }
  .onion-svg {
    width: 220px;
    height: 220px;
    filter: drop-shadow(0 15px 25px rgba(0,0,0,0.7));
  }

  /* हेडिंग्स आणि स्थानिक भाषा */
  .title-group {
    text-align: center;
  }
  .english-state {
    font-size: 64px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: linear-gradient(180deg, #ffffff 30%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 15px 30px rgba(0,0,0,0.8);
    line-height: 1.1;
  }
  .local-title {
    font-size: 42px;
    font-weight: 700;
    color: #fcd34d;
    margin-top: 10px;
    text-shadow: 0 4px 15px rgba(252, 211, 77, 0.35);
    line-height: 1.3;
  }
  .sub-title {
    font-size: 24px;
    color: #94a3b8;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 600;
    margin-top: 14px;
  }

  /* इन्फो आणि तारीख कार्ड (Glassmorphism) */
  .glass-card {
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 22px 35px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 20px 30px rgba(0,0,0,0.5);
  }
  .date-box h3 {
    font-size: 16px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .date-box p {
    font-size: 30px;
    font-weight: 800;
    color: #ffffff;
    margin-top: 4px;
  }
  .records-box {
    text-align: right;
  }
  .records-box h3 {
    font-size: 16px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .records-box p {
    font-size: 30px;
    font-weight: 800;
    color: #38bdf8;
    margin-top: 4px;
  }

  /* फूटर आणि स्वाइप कॉल-टू-ॲक्शन */
  .footer-cta {
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
    padding: 16px;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #f1f5f9;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .arrow-bounce {
    font-size: 26px;
    color: #fcd34d;
  }
</style>
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="content-layer">
    <!-- Top Meta -->
    <div class="top-bar">
      <div class="state-badge">STATE CODE: {{STATE_CODE}}</div>
      <div class="report-tag">
        <span class="pulse-dot"></span>
        DAILY MANDI INTELLIGENCE
      </div>
    </div>

    <!-- Center Hero with Cinematic Onion -->
    <div class="hero-section">
      <div class="onion-graphic-card">
        <!-- 4K High Detail Vector Onion -->
        <svg class="onion-svg" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="onionBody" x1="256" y1="120" x2="256" y2="480" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#e11d48"/>
              <stop offset="50%" stop-color="#9f1239"/>
              <stop offset="100%" stop-color="#4c0519"/>
            </linearGradient>
            <linearGradient id="onionGold" x1="180" y1="120" x2="330" y2="480" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#fbbf24"/>
              <stop offset="50%" stop-color="#b45309"/>
              <stop offset="100%" stop-color="#78350f"/>
            </linearGradient>
          </defs>
          <!-- Sprout Stem -->
          <path d="M256 30 C256 90, 235 125, 230 145 C245 135, 267 135, 282 145 C277 125, 256 90, 256 30 Z" fill="#16a34a"/>
          <path d="M265 40 C285 85, 305 115, 320 135 C305 130, 285 130, 275 138 C280 115, 275 75, 265 40 Z" fill="#22c55e" opacity="0.8"/>
          <!-- Onion Bulb Base -->
          <path d="M256 130 C150 130, 90 220, 90 330 C90 420, 165 475, 256 475 C347 475, 422 420, 422 330 C422 220, 362 130, 256 130 Z" fill="url(#onionBody)"/>
          <!-- Skin Layers -->
          <path d="M256 130 C190 150, 140 230, 140 330 C140 415, 195 465, 256 475 C210 455, 175 405, 175 330 C175 240, 220 160, 256 130 Z" fill="url(#onionGold)" opacity="0.45"/>
          <path d="M256 130 C322 150, 372 230, 372 330 C372 415, 317 465, 256 475 C302 455, 337 405, 337 330 C337 240, 292 160, 256 130 Z" fill="url(#onionGold)" opacity="0.45"/>
          <!-- Root Base -->
          <path d="M236 475 C246 495, 250 505, 240 512 C252 505, 260 505, 272 512 C262 505, 266 495, 276 475 Z" fill="#d97706"/>
        </svg>
      </div>

      <div class="title-group">
        <h1 class="english-state">{{STATE_NAME}}</h1>
        <h2 class="local-title">{{LOCAL_TITLE}}</h2>
        <p class="sub-title">ONION MANDI RATES TODAY</p>
      </div>
    </div>

    <!-- Data Glass Card -->
    <div class="glass-card">
      <div class="date-box">
        <h3>Report Date</h3>
        <p>{{POST_DATE}}</p>
      </div>
      <div class="records-box">
        <h3>Total Markets</h3>
        <p>{{TOTAL_RECORDS}} Mandis</p>
      </div>
    </div>

    <!-- Footer Action -->
    <div class="footer-cta">
      <span>SWIPE LEFT FOR COMPLETE PRICE TABLE</span>
      <span class="arrow-bounce">👉</span>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: 24px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f4f7f6;
    width: 1080px;
    height: 1080px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .header {
    text-align: center;
    background: #1b5e20;
    color: white;
    padding: 14px 20px;
    border-radius: 10px;
  }
  .header h1 { 
    margin: 0; 
    font-size: 32px; 
    font-weight: 700;
  }
  .header p { 
    margin: 4px 0 0; 
    font-size: 18px; 
    color: #e8f5e9;
  }
  .table-container {
    flex-grow: 1;
    margin-top: 14px;
    margin-bottom: 10px;
    background: white;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #e0e0e0;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    padding: 8px 12px;
    text-align: left;
    font-size: 17px;
    border-bottom: 1px solid #eceff1;
  }
  th {
    background: #2e7d32;
    color: white;
    font-weight: bold;
    font-size: 18px;
  }
  .modal-price {
    font-weight: bold;
    color: #b71c1c;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    font-size: 16px;
    color: #555;
    padding: 4px 6px;
  }
</style>
</head>
<body>
  <div>
    <div class="header">
      <h1>{{STATE_NAME}} Onion Market Rates</h1>
      <p>Date: {{POST_DATE}}</p>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>District</th>
            <th>Market</th>
            <th>Min Price</th>
            <th>Max Price</th>
            <th>Modal Price</th>
          </tr>
        </thead>
        <tbody>
          {{TABLE_ROWS}}
        </tbody>
      </table>
    </div>
  </div>
  <div class="footer">
    <span>Page {{CURRENT_PAGE}} of {{TOTAL_PAGES}}</span>
    <span>Daily Onion Mandi Rates Update</span>
  </div>
</body>
</html>
